# Render Blueprint — 대시보드에서 New > Blueprint 로 이 저장소를 고르면 아래 설정대로 만들어진다.
services:
  - type: web
    name: curry-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /about
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: UPSTASH_REDIS_REST_URL
        sync: false        # 대시보드에서 직접 넣는다
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
